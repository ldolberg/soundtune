name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release -p soundtune
      - uses: actions/upload-artifact@v4
        with:
          name: soundtune-linux-x64
          path: target/release/soundtune

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-librsvg
            zip
      - run: cargo test -p soundtune-dsp
      - run: SKIP_DEPS=1 bash packaging/windows/package.sh
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\soundtune.iss
      - uses: actions/upload-artifact@v4
        with:
          name: soundtune-windows-x64
          path: |
            dist/SoundTune-windows-x64.zip
            dist/SoundTune-setup-x64.exe
