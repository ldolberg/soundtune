[package]
name = "soundtune"
version = "0.1.0"
edition = "2021"
description = "Live voice effects console (autotune, high pitch, distortion, reverb)"
license = "MIT"

[dependencies]
soundtune-dsp = { path = "../dsp" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
cpal = "0.15"
rtrb = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "ogg", "vorbis", "pcm"] }

[dev-dependencies]
hound = "3.5.1"
